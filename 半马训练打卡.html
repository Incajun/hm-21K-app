.progress-label strong{color:#4fc3f7;font-size:16px}
.progress-bar{height:7px;background:#2a2a2a;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#29b6f6);border-radius:4px;transition:width .3s}
.week-card{background:#1a1a1a;border-radius:10px;margin-bottom:10px;overflow:hidden}
.week-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.week-header:active{background:#222}
.week-title{font-size:14px;font-weight:600;color:#fff}
.week-meta{font-size:11px;color:#666;margin-top:2px}
.week-badge{font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.week-badge.done{background:#1b3a1b;color:#66bb6a}
.week-badge.partial{background:#333;color:#ffb74d}
.week-badge.pending{background:#222;color:#555}
.week-arrow{font-size:12px;color:#444;transition:transform .2s}
.week-card.open .week-arrow{transform:rotate(90deg)}
.week-body{display:none;padding:0 14px 12px}
.week-card.open .week-body{display:block}
.day-card{background:#0f0f0f;border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;border-left:3px solid transparent}
.day-card:active{background:#161616}
.day-card.checked{border-left-color:#66bb6a}
.day-card.rest{opacity:.4}
.day-header{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.day-checkbox{width:18px;height:18px;border:2px solid #444;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff}
.day-card.checked .day-checkbox{background:#66bb6a;border-color:#66bb6a}
.day-card.checked .day-checkbox::after{content:'\2713';font-weight:bold}
.day-name{font-size:12px;color:#888;min-width:30px}
.day-date{font-size:12px;color:#4fc3f7;cursor:pointer;transition:color .2s}.day-date:hover{color:#81d4fa;text-decoration:underline}
.day-dist{font-size:11px;color:#555;margin-left:auto}
.day-content{font-size:13px;color:#ccc;margin-left:26px;line-height:1.4}
.day-card.checked .day-content{color:#666}
.day-exercise{margin-left:26px;margin-top:6px;font-size:12px;color:#66bb6a;background:#1a2a1a;padding:4px 8px;border-radius:4px;display:inline-block}
.ex-edit-btn{font-size:11px;color:#4fc3f7;margin-left:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}

// Weekday names
const WEEKDAY_CN=['周日','周一','周二','周三','周四','周五','周六'];
function getWeekdayCN(dateStr){const d=new Date(dateStr+'T00:00:00');return WEEKDAY_CN[d.getDay()];}

// Update week range from days
function updateWeekRange(w){
  const dates=w.days.map(d=>new Date(d.date+'T00:00:00'));
  const min=new Date(Math.min(...dates));
  const max=new Date(Math.max(...dates));
  const fmt=d=>(d.getMonth()+1)+'/'+d.getDate();
  w.range=fmt(min)+'-'+fmt(max);
}

// Build date index
let dateIndex={};
function rebuildIndex(){
  dateIndex={};totalTrainings=0;
  weeks.forEach((w,wi)=>{w.days.forEach((d,di)=>{dateIndex[d.date]={wi,di,content:d.content,rest:d.rest,dist:d.dist};if(!d.rest)totalTrainings++;})});
  document.getElementById('totalCount').textContent=totalTrainings;
}
// rebuildIndex() is called in init() after overrides are applied

// Apply persisted date overrides to weeks (so date changes survive refresh)
function applyWeekOverrides(){
  if(!state.weekOverrides)state.weekOverrides={};
  for(const [key,newDate] of Object.entries(state.weekOverrides)){
    const [wi,di]=key.split('-').map(Number);
    if(weeks[wi]&&weeks[wi].days[di]){
      weeks[wi].days[di].date=newDate;
      weeks[wi].days[di].d=getWeekdayCN(newDate);
    }
  }
  // Update week ranges
  weeks.forEach(w=>updateWeekRange(w));
}

}

let state={items:{},lastModified:0};
let editingDate=null;

// ====== IndexedDB Storage (reliable in mobile browsers) ======
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME);
    };
    r.onsuccess=(e)=>resolve(e.target.result);
    r.onerror=(e)=>reject(e.target.error);
  });
}
async function dbGet(key){
  try{
    const db=await openDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_NAME,'readonly');
      const store=tx.objectStore(STORE_NAME);
      const req=store.get(key);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
      tx.oncomplete=()=>db.close();
    });
  }catch(e){console.error('dbGet error:',e);return null;}
}
async function dbSet(key,value){
  try{
    const db=await openDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_NAME,'readwrite');
      const store=tx.objectStore(STORE_NAME);
      store.put(value,key);
      tx.oncomplete=()=>{db.close();resolve();};
      tx.onerror=()=>{db.close();reject(tx.error);};
    });
  }catch(e){console.error('dbSet error:',e);}
}

// ====== IMA Sync (only when server is running) ======
function saveToServer(){
  if(!SYNC_SERVER)return;
  fetch(SYNC_SERVER+'/api/save',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items:state.items,lastModified:state.lastModified})
  }).then(r=>r.json()).then(d=>{if(d.ok)console.log('[IMA] Synced');})
    .catch(()=>{}); // silently fail — local data is primary
}
async function loadFromServer(){
  if(!SYNC_SERVER)return null;
  try{
    const r=await fetch(SYNC_SERVER+'/api/load');
    const d=await r.json();
    if(d.ok&&d.content){
      const parsed=JSON.parse(d.content);
      if(parsed.items&&Object.keys(parsed.items).length>0)return parsed;
    }
  }catch(e){}
  return null;
}

// ====== Data persistence ======
async function loadState(){
  let bestData=null, bestModified=0, bestWeekOverrides=null;
  // 1. Try IndexedDB first
  try{
    const data=await dbGet(STORE_NAME);
    if(data&&data.items&&Object.keys(data.items).length>0){
      bestData=data.items; bestModified=data.lastModified||0; bestWeekOverrides=data.weekOverrides||null;
      console.log('[DB] Loaded',Object.keys(bestData).length,'records from IndexedDB');
    }
  }catch(e){console.error('IndexedDB load error:',e);}
  // 2. Also check localStorage backup (all keys, including emergency)
  try{
    for(const key of ['hm_train_state_v4','hm_train_state_v3','hm_train_state_v2','hm_emergency']){
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      try{
        const s=JSON.parse(raw);
        if(!s.items||Object.keys(s.items).length===0)continue;
        if(s.lastModified&&s.lastModified>bestModified){
          bestData=s.items; bestModified=s.lastModified; bestWeekOverrides=s.weekOverrides||null;
          console.log('[DB] Found fresher data in localStorage:',key,Object.keys(bestData).length,'records');
        }else if(!bestWeekOverrides&&s.weekOverrides&&Object.keys(s.weekOverrides).length>0){
          // Even if items are stale, preserve weekOverrides from any source
          bestWeekOverrides=s.weekOverrides;
        }
      }catch(e){}
    }
  }catch(e){}
  // 3. Merge: use the best source
  if(bestData){
    state.items=bestData;
    state.lastModified=bestModified||Date.now();
    // Restore week overrides (not zero — this was the missing piece)
    state.weekOverrides=bestWeekOverrides||{};
    // Ensure data is in both stores
    saveState();
    // Clean up old localStorage keys
    try{
      for(const key of ['hm_train_state_v4','hm_train_state_v3','hm_train_state_v2']){
        localStorage.removeItem(key);
      }
    }catch(e){}
    return;
  }
  console.log('[DB] No existing data found — fresh start');
}
async function saveState(){
  state.lastModified=Date.now();
  const payload={items:state.items,lastModified:state.lastModified,weekOverrides:state.weekOverrides||{}};
  // Write to both stores — either one survives
  let dbOk=false, lsOk=false;
  try{
    await dbSet(STORE_NAME,payload);
    dbOk=true;
  }catch(e){console.error('IndexedDB write error:',e);}
  try{
    localStorage.setItem('hm_emergency',JSON.stringify(payload));
    lsOk=true;
  }catch(e){console.error('localStorage write error:',e);}
  if(dbOk||lsOk){
    console.log('[DB] Saved',Object.keys(state.items).length,'records (DB:'+dbOk,'LS:'+lsOk+')');
  }else{
    console.error('[DB] CRITICAL: both stores failed!');
  }
  saveToServer();
}

// ====== Rendering ======
function renderAll(){renderProgress();renderWeeks();}
function renderProgress(){
  let done=0;
  // Same criteria as renderWeeks: only count checked records for non-rest days in the plan
  for(const date of Object.keys(state.items)){
    if(!state.items[date].checked)continue;
    const di=dateIndex[date];
    if(!di||di.rest)continue;
    done++;
  }
  document.getElementById('doneCount').textContent=done;
  document.getElementById('progressFill').style.width=(done/totalTrainings*100)+'%';
}
function renderWeeks(){
  const container=document.getElementById('weeks');
  container.innerHTML='';
  weeks.forEach((w,wi)=>{
    let done=0,total=0;
    w.days.forEach(d=>{if(!d.rest){total++;if(state.items[d.date]&&state.items[d.date].checked)done++;}});
    const badgeClass=done===total?'done':(done>0?'partial':'pending');
    const badgeText=done+'/'+total;
    const card=document.createElement('div');
    card.className='week-card'+(wi===0?' open':'');
    card.innerHTML=`<div class="week-header" onclick="this.parentElement.classList.toggle('open')"><div><div class="week-title">第${w.n}周 · ${w.phase}</div><div class="week-meta">${w.range}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="week-badge ${badgeClass}">${badgeText}</span><span class="week-arrow">▶</span></div></div><div class="week-body" id="wb${wi}"></div>`;
    const body=card.querySelector('.week-body');
    w.days.forEach(d=>{
      const item=state.items[d.date]||{checked:false};
      const dayCard=document.createElement('div');
      dayCard.className='day-card'+(item.checked?' checked':'')+(d.rest?' rest':'');
      let exHtml='';
      if(item.exercise){
        const ex=item.exercise;
        const parts=[];
        if(ex.distance)parts.push(ex.distance+'km');
        if(ex.duration)parts.push(ex.duration);
        if(ex.pace)parts.push(ex.pace);
        if(ex.hr)parts.push(ex.hr+'bpm');
        if(ex.cadence)parts.push(ex.cadence+'spm');
        exHtml=`<div class="day-exercise">${parts.join(' · ')}<span class="ex-edit-btn" onclick="event.stopPropagation();openEditModal('${d.date}')">编辑</span></div>`;
      }
      dayCard.innerHTML=`<div class="day-header"><div class="day-checkbox"></div><span class="day-name">${getWeekdayCN(d.date)}</span><span class="day-date" onclick="event.stopPropagation();openDateEditor('${d.date}')" title="点击修改日期">${d.date.slice(5).replace('-','/')}</span><span class="day-dist">${d.dist}</span></div><div class="day-content">${d.content}</div>${exHtml}`;
      if(!d.rest){
        dayCard.onclick=()=>toggleDay(d.date);
      }
      body.appendChild(dayCard);
    });
    container.appendChild(card);
  });
}

// ====== Day Interaction ======
function toggleDay(date){
  const item=state.items[date]||{checked:false};
  item.checked=!item.checked;
  state.items[date]=item;
  saveState();
  renderAll();
  if(item.checked){
    const di=dateIndex[date];
    if(di&&!di.rest){
      showToast('已打卡：'+di.content.substring(0,20)+'...');
      // Auto-open exercise data form — deferred to avoid DOM race with renderAll
      setTimeout(()=>openEditModal(date), 50);
    }
  }
}

// ====== Exercise Edit ======
function openEditModal(date){
  editingDate=date;
  const item=state.items[date]||{checked:true,exercise:{}};
  if(!item.checked){item.checked=true;state.items[date]=item;saveState();}
  const ex=item.exercise||{};
  document.getElementById('editTitle').textContent='运动数据 · '+date;
  document.getElementById('editDistance').value=ex.distance||'';
  document.getElementById('editDuration').value=ex.duration||'';
  document.getElementById('editPace').value=ex.pace||'';
  document.getElementById('editHR').value=ex.hr||'';
  document.getElementById('editCadence').value=ex.cadence||'';
  document.getElementById('editNotes').value=ex.notes||'';
  document.getElementById('editModal').style.display='flex';
}
function updatePace(){
  const dist=parseFloat(document.getElementById('editDistance').value);
  const dur=document.getElementById('editDuration').value;
  document.getElementById('editPace').value=calcPace(dist,dur);
}
function calcPace(dist,dur){
  if(!dist||!dur)return'';
  const parts=dur.split(':');
  let sec=0;
  if(parts.length===2)sec=parseInt(parts[0])*60+parseInt(parts[1]);
  else if(parts.length===3)sec=parseInt(parts[0])*3600+parseInt(parts[1])*60+parseInt(parts[2]);
  if(sec===0||dist===0)return'';
  const ps=sec/dist;
  const m=Math.floor(ps/60);
  const s=Math.round(ps%60);
  return m+"'"+String(s).padStart(2,'0')+'"';
}
function saveExercise(){
  if(!editingDate)return;
  const item=state.items[editingDate]||{checked:true};
  item.exercise={
    distance:parseFloat(document.getElementById('editDistance').value)||0,
    duration:document.getElementById('editDuration').value,
    pace:document.getElementById('editPace').value,
    hr:parseInt(document.getElementById('editHR').value)||0,
    cadence:parseInt(document.getElementById('editCadence').value)||0,
    notes:document.getElementById('editNotes').value
  };
  state.items[editingDate]=item;
  saveState();
  renderAll();
  document.getElementById('editModal').style.display='none';
  showToast('运动数据已保存');
}

// ====== Date Editor ======
let dateEditing={oldDate:null,wi:null,di:null};
function openDateEditor(date){
  const idx=dateIndex[date];
  if(!idx)return;
  dateEditing={oldDate:date,wi:idx.wi,di:idx.di};
  document.getElementById('dateModalInput').value=date;
  document.getElementById('dateModalInfo').textContent='原日期：'+date+' '+getWeekdayCN(date);
  updateDatePreview();
  document.getElementById('dateModal').style.display='flex';
}
function updateDatePreview(){
  const newDate=document.getElementById('dateModalInput').value;
  if(newDate)document.getElementById('dateModalPreview').textContent='新星期：'+getWeekdayCN(newDate);
  else document.getElementById('dateModalPreview').textContent='';
}
function closeDateEditor(){
  document.getElementById('dateModal').style.display='none';
  dateEditing={oldDate:null,wi:null,di:null};
}
function saveDateChange(){
  const newDate=document.getElementById('dateModalInput').value;
  if(!newDate||!dateEditing.oldDate||newDate===dateEditing.oldDate){closeDateEditor();return;}
  const {wi,di,oldDate}=dateEditing;
  // Migrate state from old date key to new
  if(state.items[oldDate]){
    state.items[newDate]=state.items[oldDate];
    delete state.items[oldDate];
  }
  // Persist override so it survives refresh
  if(!state.weekOverrides)state.weekOverrides={};
  state.weekOverrides[wi+'-'+di]=newDate;
  // Update plan (for current session display)
  weeks[wi].days[di].date=newDate;
  weeks[wi].days[di].d=getWeekdayCN(newDate);
  updateWeekRange(weeks[wi]);
  rebuildIndex();
  saveState();
  renderAll();
  closeDateEditor();
  showToast('日期已更新为 '+newDate+' '+getWeekdayCN(newDate));
}
document.getElementById('dateModalInput').addEventListener('input',updateDatePreview);

// ====== Backup ======
function toggleBackupMenu(){document.getElementById('backupMenu').classList.toggle('show');}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='半马训练备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  showToast('备份已导出');
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(data.items){
        state.items=data.items;
        if(data.lastModified)state.lastModified=data.lastModified;
        if(data.weekOverrides)state.weekOverrides=data.weekOverrides;
        // Apply overrides and rebuild index
        resetWeeksToOriginal();
        applyWeekOverrides();
        rebuildIndex();
        saveState();
        renderAll();
        showToast('数据已导入');
      }
    }catch(e){showToast('文件格式错误');}
  };
  reader.readAsText(file);
  document.getElementById('importInput').value='';
}

// ====== Utils ======
// ====== Reset ======
function showResetConfirm(){
  document.getElementById('resetModal').style.display='flex';
  document.getElementById('resetInput').value='';
  document.getElementById('resetBtn').disabled=true;
}
function closeResetModal(){
  document.getElementById('resetModal').style.display='none';
}
function doReset(){
  if(document.getElementById('resetInput').value!=='确认重置')return;
  state.items={};
  state.weekOverrides={};
  resetWeeksToOriginal();
  rebuildIndex();
  saveState();
  renderAll();
  closeResetModal();
  showToast('所有打卡数据已重置');
}

function showToast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2500);
}

// ====== Init ======
async function init(){
  // Auto-detect sync server
  if(window.location.hostname==='localhost'||window.location.hostname.startsWith('192.168.')||window.location.hostname.startsWith('10.')){
    SYNC_SERVER='http://'+window.location.hostname+':'+window.location.port;
  }
  // 1. Reset weeks to original dates (clean base)
  resetWeeksToOriginal();
  // 2. Load state from storage
  await loadState();
  // 3. Apply persisted date overrides to weeks
  applyWeekOverrides();
  // 4. Rebuild dateIndex with overridden dates
  rebuildIndex();
  // 5. Clean orphan keys (dates not in plan or rest days, now that dateIndex is correct)
  let cleaned=false;
  for(const date of Object.keys(state.items)){
    const di=dateIndex[date];
    if(!di||di.rest){
      delete state.items[date];
      cleaned=true;
    }
  }
  if(cleaned)state.lastModified=Date.now();
  // 6. If no local data, try IMA restore
  if(Object.keys(state.items).length===0&&SYNC_SERVER){
    const cloudData=await loadFromServer();
    if(cloudData&&cloudData.items){
      state.items=cloudData.items;
      state.lastModified=cloudData.lastModified||Date.now();
      // Clean orphan keys from cloud too
      for(const date of Object.keys(state.items)){
        const di=dateIndex[date];
        if(!di||di.rest)delete state.items[date];
      }
    }
  }
  // 7. Save cleaned state
  saveState();
  // 8. Render
  renderAll();
}
init();
</script>
