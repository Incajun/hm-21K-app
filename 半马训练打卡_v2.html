<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a0a;color:#e0e0e0;max-width:600px;margin:0 auto;padding:16px;padding-bottom:100px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header h1{font-size:19px;color:#fff}
.header-right{display:flex;align-items:center;gap:10px}
.gear-btn{background:none;border:none;color:#888;font-size:13px;cursor:pointer;padding:4px 8px;-webkit-tap-highlight-color:transparent}
.backup-menu{display:none;background:#1a1a1a;border-radius:8px;padding:6px;margin-bottom:10px;gap:6px}
.backup-menu.show{display:flex}
.backup-menu button{flex:1;padding:8px;background:#222;border:1px solid #333;color:#aaa;border-radius:6px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.backup-menu button:active{background:#333}
.progress-wrap{background:#1a1a1a;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:8px}
.progress-label strong{color:#4fc3f7;font-size:16px}
.progress-bar{height:7px;background:#2a2a2a;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#29b6f6);border-radius:4px;transition:width .3s}
.progress-recovery{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid #222}
.recovery-label{font-size:10px;color:#555}
.recovery-timer{font-size:13px;color:#ffb74d;font-weight:600;font-family:"SF Mono","Consolas","Menlo",monospace}
.recovery-timer.done{color:#66bb6a}
/* === AI Analysis === */
.ai-wrap{background:#1a1a1a;border-radius:10px;padding:12px 14px;margin-bottom:14px;border:1px solid #1e2a2a}
.ai-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ai-title{font-size:14px;font-weight:600;color:#4fc3f7}
.ai-subtitle{font-size:10px;color:#555;margin-top:3px}
.ai-refresh-btn{background:#1b3a4a;border:1px solid #1e5878;color:#4fc3f7;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.ai-refresh-btn:active{background:#1e4858}
.ai-content{font-size:13px;color:#bbb;line-height:1.7;white-space:pre-wrap;min-height:30px}
.ai-placeholder{color:#555;font-size:12px;text-align:center;padding:10px 0}
.ai-loading{color:#666;font-size:12px}
.ai-loading .dot{animation:blink 1.4s infinite both}
.ai-loading .dot:nth-child(2){animation-delay:.2s}
.ai-loading .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.ai-settings-panel{margin-top:10px;padding-top:10px;border-top:1px solid #222;display:none}
.ai-settings-panel.show{display:block}
.ai-settings-panel label{font-size:11px;color:#666;display:block;margin-bottom:4px}
.ai-settings-panel input{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:6px;padding:8px;color:#e0e0e0;font-size:12px;outline:none;font-family:inherit}
.ai-settings-panel input:focus{border-color:#4fc3f7}
.ai-settings-panel a{font-size:11px;color:#4fc3f7;display:block;margin-top:6px;text-decoration:none}
.ai-settings-panel button{margin-top:6px;background:#1b3a4a;border:1px solid #1e5878;color:#4fc3f7;border-radius:6px;padding:6px 16px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ai-settings-toggle{font-size:11px;color:#555;cursor:pointer;margin-top:8px;display:inline-block;-webkit-tap-highlight-color:transparent}
.ai-source-badge{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.ai-source-badge.local{background:#2a2a1a;color:#ffb74d}
.ai-source-badge.api{background:#1a2a1a;color:#66bb6a}
/* === Week / Day Cards === */
.week-card{background:#1a1a1a;border-radius:10px;margin-bottom:10px;overflow:hidden;transition:all .3s}
.week-card.active-week{border:1px solid #1e3a4a}
.week-card.completed-collapsed{margin-bottom:3px;opacity:.45;border-left:3px solid #1b3a1b}
.week-card.completed-collapsed .week-header{padding:6px 12px}
.week-card.completed-collapsed .week-title{font-size:12px;color:#777}
.week-card.completed-collapsed .week-meta{display:none}
.week-card.completed-collapsed .week-badge.done{background:#1a2a1a;color:#4a7a4a;font-size:10px}
.week-card.completed-collapsed:hover{opacity:.7}
.week-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.week-header:active{background:#222}
.week-title{font-size:14px;font-weight:600;color:#fff;transition:font-size .2s,color .2s}
.week-meta{font-size:11px;color:#666;margin-top:2px;transition:opacity .2s}
.week-badge{font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap;transition:all .2s}
.week-badge.done{background:#1b3a1b;color:#66bb6a}
.week-badge.partial{background:#333;color:#ffb74d}
.week-badge.pending{background:#222;color:#555}
.week-arrow{font-size:12px;color:#444;transition:transform .2s}
.week-card.open .week-arrow{transform:rotate(90deg)}
.week-body{display:none;padding:0 14px 12px}
.week-card.open .week-body{display:block}
.day-card{background:#0f0f0f;border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;border-left:3px solid transparent}
.day-card:active{background:#161616}
.day-card.checked{border-left-color:#66bb6a}
.day-card.rest{opacity:.45;cursor:default}
.day-card.rest:active{background:#0f0f0f}
.day-header{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.day-checkbox{width:18px;height:18px;border:2px solid #444;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff}
.day-card.checked .day-checkbox{background:#66bb6a;border-color:#66bb6a}
.day-card.checked .day-checkbox::after{content:'\2713';font-weight:bold}
.rest-badge{font-size:10px;color:#666;background:#1a1a1a;padding:2px 8px;border-radius:4px;border:1px solid #222;flex-shrink:0}
.day-name{font-size:12px;color:#888;min-width:30px}
.day-date{font-size:12px;color:#4fc3f7;cursor:pointer;transition:color .2s}.day-date:hover{color:#81d4fa;text-decoration:underline}
.day-dist{font-size:11px;color:#555;margin-left:auto}
.day-content{font-size:13px;color:#ccc;margin-left:26px;line-height:1.4}
.day-card.checked .day-content{color:#666}
.day-card.rest .day-content{font-style:italic;color:#555}
.day-exercise{margin-left:26px;margin-top:6px;font-size:12px;color:#66bb6a;background:#1a2a1a;padding:4px 8px;border-radius:4px;display:inline-block}
.ex-edit-btn{font-size:11px;color:#4fc3f7;margin-left:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* === Modals === */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal-box{background:#1a1a1a;border-radius:14px 14px 0 0;width:100%;max-width:600px;max-height:80vh;overflow-y:auto;padding:16px}
.modal-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.btn-primary{flex:1;padding:12px;background:#1b3a4a;border:1px solid #1e5878;color:#4fc3f7;border-radius:8px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-primary:active{background:#1e4858}
.btn-secondary{flex:1;padding:12px;background:#222;border:1px solid #333;color:#888;border-radius:8px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-secondary:active{background:#2a2a2a}
.btn-danger{flex:1;padding:12px;background:#3a1a1a;border:1px solid #6b2a2a;color:#ef5350;border-radius:8px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-danger:active{background:#4a1a1a}
.btn-danger:disabled{opacity:0.35;cursor:default}
.edit-form{display:flex;flex-direction:column;gap:10px}
.edit-form label{font-size:12px;color:#888;display:flex;flex-direction:column;gap:4px}
.edit-form input,.edit-form textarea{background:#0f0f0f;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#e0e0e0;font-size:14px;font-family:inherit;outline:none}
.edit-form input:focus,.edit-form textarea:focus{border-color:#4fc3f7}
.edit-form input:read-only{color:#666}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
<h1>半马训练打卡</h1>
<div class="header-right">
<button class="gear-btn" onclick="toggleBackupMenu()">设置</button>
</div>
</div>
<div class="backup-menu" id="backupMenu">
<button onclick="exportData()">导出备份</button>
<button onclick="document.getElementById('importInput').click()">导入备份</button>
<input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(this.files[0])">
<button onclick="showResetConfirm()" style="margin-top:6px;padding:6px 10px;font-size:11px;background:transparent;border:1px solid #5a2a2a;color:#8b5a5a;border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent">重置所有打卡</button>
</div>
<div class="progress-wrap">
<div class="progress-label"><span>训练进度</span><span><strong id="doneCount">0</strong>/<span id="totalCount">0</span></span></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="progress-recovery" id="recoveryRow" onclick="openRecoveryModal()" style="cursor:pointer"><span class="recovery-label">恢复倒计时</span><span class="recovery-timer" id="recoveryTimer">--</span></div>
</div>
<!-- AI Analysis Section -->
<div class="ai-wrap" id="aiWrap">
<div class="ai-header">
<div>
<div class="ai-title">AI 训练分析</div>
<div class="ai-subtitle" id="aiSubtitle">完成打卡后查看训练数据分析</div>
</div>
<button class="ai-refresh-btn" onclick="runAIAnalysis(true)">刷新</button>
</div>
<div class="ai-content" id="aiContent">
<div class="ai-placeholder">完成训练打卡并填写运动数据后，这里会显示AI分析建议</div>
</div>
<span class="ai-settings-toggle" onclick="toggleAISettings()">AI引擎设置</span>
<div class="ai-settings-panel" id="aiSettingsPanel">
<label>DeepSeek API Key（注册即送免费额度，留空则使用本地分析）</label>
<input type="password" id="deepseekKeyInput" placeholder="粘贴 API Key">
<a href="https://platform.deepseek.com/api_keys" target="_blank">→ 免费获取 DeepSeek API Key（国内直连，无需科学上网）</a>
<button onclick="saveAPIKey()">保存</button>
</div>

// Weekday names
const WEEKDAY_CN=['周日','周一','周二','周三','周四','周五','周六'];
function getWeekdayCN(dateStr){const d=new Date(dateStr+'T00:00:00');return WEEKDAY_CN[d.getDay()];}

// Update week range from days
function updateWeekRange(w){
  const dates=w.days.map(d=>new Date(d.date+'T00:00:00'));
  const min=new Date(Math.min(...dates));
  const max=new Date(Math.max(...dates));
  const fmt=d=>(d.getMonth()+1)+'/'+d.getDate();
  w.range=fmt(min)+'-'+fmt(max);
}

// ====== Config ======
const DB_NAME='hm_train_db';
const STORE_NAME='state';
const DB_VERSION=1;
const SYNC_SERVER='';

// ====== State ======
let state={items:{},lastModified:0,recoveryOverride:null};
let editingDate=null;
let recoveryTimerId=null;

// ====== IndexedDB Storage ======
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME);
    };
    r.onsuccess=(e)=>resolve(e.target.result);
    r.onerror=(e)=>reject(e.target.error);
  });
}
async function dbGet(key){
  try{
    const db=await openDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_NAME,'readonly');
      const store=tx.objectStore(STORE_NAME);
      const req=store.get(key);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
      tx.oncomplete=()=>db.close();
    });
  }catch(e){console.error('dbGet error:',e);return null;}
}
async function dbSet(key,value){
  try{
    const db=await openDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_NAME,'readwrite');
      const store=tx.objectStore(STORE_NAME);
      store.put(value,key);
      tx.oncomplete=()=>{db.close();resolve();};
      tx.onerror=()=>{db.close();reject(tx.error);};
    });
  }catch(e){console.error('dbSet error:',e);}
}

// ====== IMA Sync ======
function saveToServer(){
  if(!SYNC_SERVER)return;
  fetch(SYNC_SERVER+'/api/save',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items:state.items,lastModified:state.lastModified})
  }).then(r=>r.json()).then(d=>{if(d.ok)console.log('[IMA] Synced');})
    .catch(()=>{});
}
async function loadFromServer(){
  if(!SYNC_SERVER)return null;
  try{
    const r=await fetch(SYNC_SERVER+'/api/load');
    const d=await r.json();
    if(d.ok&&d.content){
      const parsed=JSON.parse(d.content);
      if(parsed.items&&Object.keys(parsed.items).length>0)return parsed;
    }
  }catch(e){}
  return null;
}

// ====== Data persistence ======
async function loadState(){
  let bestData=null, bestModified=0, bestWeekOverrides=null, bestRecoveryOverride=null;
  try{
    const data=await dbGet(STORE_NAME);
    if(data&&data.items&&Object.keys(data.items).length>0){
      bestData=data.items; bestModified=data.lastModified||0; bestWeekOverrides=data.weekOverrides||null; bestRecoveryOverride=data.recoveryOverride||null;
      console.log('[DB] Loaded',Object.keys(bestData).length,'records from IndexedDB');
    }
  }catch(e){console.error('IndexedDB load error:',e);}
  try{
    for(const key of ['hm_train_state_v4','hm_train_state_v3','hm_train_state_v2','hm_emergency']){
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      try{
        const s=JSON.parse(raw);
        if(!s.items||Object.keys(s.items).length===0)continue;
        if(s.lastModified&&s.lastModified>bestModified){
          bestData=s.items; bestModified=s.lastModified; bestWeekOverrides=s.weekOverrides||null; bestRecoveryOverride=s.recoveryOverride||null;
          console.log('[DB] Found fresher data in localStorage:',key,Object.keys(bestData).length,'records');
        }else if(!bestWeekOverrides&&s.weekOverrides&&Object.keys(s.weekOverrides).length>0){
          bestWeekOverrides=s.weekOverrides;
        }
      }catch(e){}
    }
  }catch(e){}
  if(bestData){
    state.items=bestData;
    state.lastModified=bestModified||Date.now();
    state.weekOverrides=bestWeekOverrides||{};
    state.recoveryOverride=bestRecoveryOverride||null;
    saveState();
    try{
      for(const key of ['hm_train_state_v4','hm_train_state_v3','hm_train_state_v2']){
        localStorage.removeItem(key);
      }
    }catch(e){}
    return;
  }
  console.log('[DB] No existing data found — fresh start');
}
async function saveState(){
  state.lastModified=Date.now();
  const payload={items:state.items,lastModified:state.lastModified,weekOverrides:state.weekOverrides||{},recoveryOverride:state.recoveryOverride||null};
  let dbOk=false, lsOk=false;
  try{
    await dbSet(STORE_NAME,payload);
    dbOk=true;
  }catch(e){console.error('IndexedDB write error:',e);}
  try{
    localStorage.setItem('hm_emergency',JSON.stringify(payload));
    lsOk=true;
  }catch(e){console.error('localStorage write error:',e);}
  if(dbOk||lsOk){
    console.log('[DB] Saved',Object.keys(state.items).length,'records (DB:'+dbOk,'LS:'+lsOk+')');
  }else{
    console.error('[DB] CRITICAL: both stores failed!');
  }
  saveToServer();
}

// ====== Recovery Countdown ======
function getRecoveryHours(ex){
  const dist=ex.distance||0;
  let base=12;
  if(dist<=3)base=18;
  else if(dist<=6)base=24;
  else if(dist<=9)base=30;
  else if(dist<=13)base=36;
  else if(dist<=17)base=48;
  else base=60;
  const hr=ex.hr||0;
  if(hr>160)base+=12;
  else if(hr>155)base+=8;
  else if(hr>150)base+=4;
  if(ex.pace){
    const m=ex.pace.match(/(\d+)'(\d+)/);
    if(m){
      const paceSec=parseInt(m[1])*60+parseInt(m[2]);
      if(paceSec<390)base+=3;
      else if(paceSec>420)base-=3;
    }
  }
  return Math.max(12,base);
}

function calculateRecovery(){
  let latestDate=null,latestEx=null,latestTime=0;
  for(const [date,item] of Object.entries(state.items)){
    if(!item.checked||!item.exercise||!(item.exercise.distance>0))continue;
    const di=dateIndex[date];
    if(!di||di.rest)continue;
    const exTime=item.exercise.exerciseTime||0;
    if(!latestDate||date>latestDate||(date===latestDate&&exTime>latestTime)){
      latestDate=date;latestEx=item.exercise;latestTime=exTime;
    }
  }
  if(!latestEx)return null;
  const hours=state.recoveryOverride?state.recoveryOverride.hours:getRecoveryHours(latestEx);
  let startTime=latestTime;
  if(!startTime){
    startTime=Date.now();
    latestEx.exerciseTime=startTime;
    saveState();
  }
  return new Date(startTime+hours*3600000);
}

function updateRecoveryCountdown(){
  try{
    const row=document.getElementById('recoveryRow');
    const timer=document.getElementById('recoveryTimer');
    if(!row||!timer)return;
    const recoveryUntil=calculateRecovery();
    if(!recoveryUntil){
      row.style.display='none';
      if(recoveryTimerId){clearInterval(recoveryTimerId);recoveryTimerId=null;}
      return;
    }
    row.style.display='flex';
    if(recoveryTimerId)clearInterval(recoveryTimerId);
    const tick=()=>{
      const remaining=recoveryUntil.getTime()-Date.now();
      if(remaining<=0){
        timer.textContent='已恢复';
        timer.className='recovery-timer done';
        if(recoveryTimerId){clearInterval(recoveryTimerId);recoveryTimerId=null;}
        return;
      }
      const h=Math.floor(remaining/3600000);
      const m=Math.floor((remaining%3600000)/60000);
      const s=Math.floor((remaining%60000)/1000);
      timer.textContent=h+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
      timer.className='recovery-timer';
    };
    tick();
    recoveryTimerId=setInterval(tick,1000);
  }catch(e){console.error('Recovery countdown error:',e);}
}

function openRecoveryModal(){

// [Change 2] Find the first incomplete week — this week stays open, completed weeks auto-collapse
function getActiveWeekIndex(){
  for(let i=0;i<weeks.length;i++){
    const w=weeks[i];
    let done=0,total=0;
    w.days.forEach(d=>{
      if(!d.rest){
        total++;
        if(state.items[d.date]&&state.items[d.date].checked)done++;
      }
    });
    if(done<total)return i;
  }
  return weeks.length-1;
}

function renderWeeks(){
  const container=document.getElementById('weeks');
  container.innerHTML='';
  const activeWeek=getActiveWeekIndex();
  weeks.forEach((w,wi)=>{
    let done=0,total=0;
    w.days.forEach(d=>{if(!d.rest){total++;if(state.items[d.date]&&state.items[d.date].checked)done++;}});
    const badgeClass=done===total?'done':(done>0?'partial':'pending');
    const badgeText=done+'/'+total;
    const isActive=wi===activeWeek;
    const isCompleted=done===total&&!isActive;
    const card=document.createElement('div');
    card.className='week-card'+(isActive?' open active-week':'')+(isCompleted?' completed-collapsed':'');
    card.innerHTML=`<div class="week-header" onclick="this.parentElement.classList.toggle('open');this.parentElement.classList.toggle('active-week')"><div><div class="week-title">第${w.n}周 · ${w.phase}</div><div class="week-meta">${w.range}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="week-badge ${badgeClass}">${badgeText}</span><span class="week-arrow">▶</span></div></div><div class="week-body" id="wb${wi}"></div>`;
    const body=card.querySelector('.week-body');
    w.days.forEach(d=>{
      const item=state.items[d.date]||{checked:false};
      const dayCard=document.createElement('div');
      dayCard.className='day-card'+(item.checked?' checked':'')+(d.rest?' rest':'');
      let exHtml='';
      if(item.exercise){
        const ex=item.exercise;
        const parts=[];
        if(ex.distance)parts.push(ex.distance+'km');
        if(ex.duration)parts.push(ex.duration);
        if(ex.pace)parts.push(ex.pace);
        if(ex.hr)parts.push(ex.hr+'bpm');
        if(ex.cadence)parts.push(ex.cadence+'spm');
        exHtml=`<div class="day-exercise">${parts.join(' · ')}<span class="ex-edit-btn" onclick="event.stopPropagation();openEditModal('${d.date}')">编辑</span></div>`;
      }
      // [Change 1] Rest days: show "休息" badge instead of checkbox, no click handler
      const checkboxHtml=d.rest?'<span class="rest-badge">休息</span>':'<div class="day-checkbox"></div>';
      dayCard.innerHTML=`<div class="day-header">${checkboxHtml}<span class="day-name">${getWeekdayCN(d.date)}</span><span class="day-date" onclick="event.stopPropagation();openDateEditor('${d.date}')" title="点击修改日期">${d.date.slice(5).replace('-','/')}</span><span class="day-dist">${d.dist}</span></div><div class="day-content">${d.content}</div>${exHtml}`;
      if(!d.rest){
        dayCard.onclick=()=>toggleDay(d.date);
      }
      body.appendChild(dayCard);
    });
    container.appendChild(card);
  });
  // Auto-scroll to active week only if it's outside viewport
  setTimeout(()=>{
    const active=container.querySelector('.week-card.active-week');
    if(!active)return;
    const rect=active.getBoundingClientRect();
    const vh=window.innerHeight;
    if(rect.top>=0&&rect.bottom<=vh)return; // already fully visible
    active.scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}

  }

  const di=dateIndex[date];

function updatePace(){
  const dist=parseFloat(document.getElementById('editDistance').value);
  const dur=document.getElementById('editDuration').value;
  document.getElementById('editPace').value=calcPace(dist,dur);
}
function calcPace(dist,dur){
  if(!dist||!dur)return'';
  const parts=dur.split(':');
  let sec=0;
  if(parts.length===2)sec=parseInt(parts[0])*60+parseInt(parts[1]);
  else if(parts.length===3)sec=parseInt(parts[0])*3600+parseInt(parts[1])*60+parseInt(parts[2]);
  if(sec===0||dist===0)return'';
  const ps=sec/dist;
  const m=Math.floor(ps/60);
  const s=Math.round(ps%60);
  return m+"'"+String(s).padStart(2,'0')+'"';
}
function saveExercise(){
  if(!editingDate)return;
  const item=state.items[editingDate]||{checked:true};
  const prevEx=(state.items[editingDate]&&state.items[editingDate].exercise)||{};
  item.exercise={
    distance:parseFloat(document.getElementById('editDistance').value)||0,
    duration:document.getElementById('editDuration').value,
    pace:document.getElementById('editPace').value,
    hr:parseInt(document.getElementById('editHR').value)||0,
    cadence:parseInt(document.getElementById('editCadence').value)||0,
    notes:document.getElementById('editNotes').value,
    exerciseTime:prevEx.exerciseTime||Date.now()
  };
  state.items[editingDate]=item;
  saveState();
  renderAll();
  document.getElementById('editModal').style.display='none';
  showToast('运动数据已保存');
}

// ====== [Change 3] AI Analysis ======
let aiAnalysisTimer=0;

function collectTrainingData(){
  const data={totalDistance:0,totalRuns:0,totalDuration:0,paces:[],heartRates:[],cadences:[],weeklyData:[]};
  weeks.forEach((w)=>{
    let weekDist=0,weekCount=0;
    w.days.forEach(d=>{
      if(d.rest)return;
      const item=state.items[d.date];
      if(item&&item.checked){
        data.totalRuns++;
        if(item.exercise){
          const ex=item.exercise;
          data.totalDistance+=ex.distance||0;
          if(ex.duration){
            const parts=ex.duration.split(':');
            let sec=0;
            if(parts.length===2)sec=parseInt(parts[0])*60+parseInt(parts[1]);
            else if(parts.length===3)sec=parseInt(parts[0])*3600+parseInt(parts[1])*60+parseInt(parts[2]);
            data.totalDuration+=sec;
          }
          weekDist+=ex.distance||0;
          if(ex.pace){
            const m=ex.pace.match(/(\d+)'(\d+)/);
            if(m)data.paces.push({pace:ex.pace,sec:parseInt(m[1])*60+parseInt(m[2])});
          }
          if(ex.hr)data.heartRates.push(ex.hr);
          if(ex.cadence)data.cadences.push(ex.cadence);
        }
        weekCount++;
      }
    });
    data.weeklyData.push({week:w.n,phase:w.phase,distance:weekDist,runs:weekCount});
  });
  return data;
}

function localAnalysis(data){
  if(data.totalRuns===0){
    return{text:'还没有打卡记录。完成第一次训练打卡并填写运动数据后，这里会自动生成训练分析。'};
  }
  // 精简数据概览（一行）
  const summary=[];
  summary.push('累计 '+data.totalRuns+' 次 / '+data.totalDistance.toFixed(1)+'km');
  if(data.paces.length>0){
    const avgPaceSec=data.paces.reduce((a,b)=>a+b.sec,0)/data.paces.length;
    const m=Math.floor(avgPaceSec/60);
    const s=Math.round(avgPaceSec%60);
    summary.push('配速 '+m+"'"+String(s).padStart(2,'0')+'"');
  }
  if(data.heartRates.length>0){
    const avgHR=Math.round(data.heartRates.reduce((a,b)=>a+b,0)/data.heartRates.length);
    summary.push('心率 '+avgHR);
  }
  if(data.cadences.length>0){
    const avgCad=Math.round(data.cadences.reduce((a,b)=>a+b,0)/data.cadences.length);
    summary.push('步频 '+avgCad);
  }
  const lines=[summary.join(' · ')];

  // 核心问题/建议（最多2条，按优先级）
  const alerts=[];
  if(data.cadences.length>0){
    const avgCad=Math.round(data.cadences.reduce((a,b)=>a+b,0)/data.cadences.length);
    if(avgCad<170)alerts.push('步频偏低，建议多做步频训练（目标180+）');
    else if(avgCad<175)alerts.push('步频尚可，继续向180靠拢');
  }
  if(data.heartRates.length>0){
    const avgHR=Math.round(data.heartRates.reduce((a,b)=>a+b,0)/data.heartRates.length);
    if(avgHR>160)alerts.push('心率偏高，增加低强度有氧（心率<150（鼻呼吸/能完整对话））巩固基础');
    else if(avgHR>155)alerts.push('心率适中偏快，注意区分阈值跑和轻松跑区间');
  }
  if(data.paces.length>=2){
    const recent=data.paces.slice(-3);
    const earlier=data.paces.slice(0,-3);
    if(earlier.length>0){
      const recentAvg=recent.reduce((a,b)=>a+b.sec,0)/recent.length;
      const earlierAvg=earlier.reduce((a,b)=>a+b.sec,0)/earlier.length;
      const diff=earlierAvg-recentAvg;
      if(diff>5)alerts.push('近期配速比之前快 '+Math.round(diff)+'秒/km');
      else if(diff<-5)alerts.push('近期配速比之前慢 '+Math.round(-diff)+'秒/km，注意控制强度');
    }
  }
  const completedWeeks=data.weeklyData.filter(w=>w.runs>0);
  if(completedWeeks.length>=2){
    const last=completedWeeks[completedWeeks.length-1];
    const prev=completedWeeks[completedWeeks.length-2];
    if(prev.distance>0&&last.distance>0){
      const change=((last.distance/prev.distance-1)*100);
      if(change>15)alerts.push('本周跑量增量较大（+'+change.toFixed(0)+'%），注意预防伤病');
      else if(change<-30)alerts.push('本周跑量下降 '+(-change).toFixed(0)+'%，适当减量利于恢复');
    }
  }
  if(alerts.length>0){
    lines.push('');
    lines.push('注意：'+alerts.slice(0,2).join('；'));
  }

  // 当前阶段方向
  const activeWeek=getActiveWeekIndex();
  const currentPhase=weeks[activeWeek]?weeks[activeWeek].phase:'';
  if(currentPhase){
    let phaseAdvice='';
    if(currentPhase==='恢复周')phaseAdvice='低强度恢复为主，不要急于提速';
    else if(currentPhase==='有氧底座')phaseAdvice='积累有氧里程，心率控制在155以下';
    else if(currentPhase==='阈值突破')phaseAdvice='阈值跑心率160-165，长距离保持稳速';
    else if(currentPhase==='阈值测试')phaseAdvice='10km测试评估能力，记录成绩作为参考';
    else if(currentPhase==='半马专项')phaseAdvice='长距离模拟比赛配速，注意补给练习';
    else if(currentPhase==='减量期')phaseAdvice='减量保持强度，减少跑量积蓄体能';
    else if(currentPhase==='比赛周')phaseAdvice='赛前充分休息，保持肌肉活性即可';
    lines.push('');
    lines.push('阶段：'+currentPhase+' — '+phaseAdvice);
  }
  return{text:lines.join('\n')};
}

    });
  });
  const prompt='你是一位专业的半马跑步教练，请基于以下训练数据给出分析和建议。\n\n训练计划：14周半马训练计划（恢复周→有氧底座→阈值突破→阈值测试→半马专项→减量期→比赛周）\n\n当前进度：第'+(activeWeek+1)+'周，阶段：'+currentPhase+'\n\n训练数据汇总：\n- 总训练次数：'+data.totalRuns+'\n- 累计跑量：'+data.totalDistance.toFixed(1)+'km\n'+(data.paces.length>0?'- 最近配速：'+data.paces[data.paces.length-1].pace:'')+'\n'+(data.heartRates.length>0?'- 平均心率：'+Math.round(data.heartRates.reduce((a,b)=>a+b,0)/data.heartRates.length)+'bpm':'')+'\n'+(data.cadences.length>0?'- 平均步频：'+Math.round(data.cadences.reduce((a,b)=>a+b,0)/data.cadences.length)+'spm':'')+'\n\n每周训练情况：\n'+weekSummary+'\n\n最近5次训练：\n'+recentRuns.slice(-5).join('\n')+'\n\n请给出：\n1. 训练状态评估（进步/退步/稳定）\n2. 关键指标分析（配速、心率、步频）\n3. 下次训练建议\n4. 需要注意的风险点\n\n用简洁要点形式回答，控制在200字以内。';
  try{
    const response=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({
        model:'deepseek-chat',
        messages:[{role:'user',content:prompt}],
        temperature:0.7,
        max_tokens:600
      })
    });
    if(!response.ok){
      const err=await response.text();
      console.error('DeepSeek API error:',response.status,err);
      return null;
    }
    const result=await response.json();
    if(result.choices&&result.choices[0]){
      return result.choices[0].message.content;
    }
    return null;
  }catch(e){
    console.error('DeepSeek API call failed:',e);
    return null;
  }
}

async function runAIAnalysis(force){
  const now=Date.now();
  if(!force&&now-aiAnalysisTimer<3000)return;
  aiAnalysisTimer=now;
  const data=collectTrainingData();
  const contentEl=document.getElementById('aiContent');
  const subtitleEl=document.getElementById('aiSubtitle');
  if(data.totalRuns===0){
    contentEl.innerHTML='<div class="ai-placeholder">完成训练打卡并填写运动数据后，这里会显示AI分析建议</div>';
    subtitleEl.textContent='暂无训练数据';
    return;
  }
  contentEl.innerHTML='<div class="ai-loading">分析中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>';
  subtitleEl.textContent='正在分析...';
  const apiKey=localStorage.getItem('deepseek_api_key');
  if(apiKey){
    const aiResult=await callDeepSeekAPI(data);
    if(aiResult){
      contentEl.textContent=aiResult;
      subtitleEl.innerHTML='DeepSeek AI <span class="ai-source-badge api">AI</span> · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      return;
    }
  }
  const local=localAnalysis(data);
  contentEl.textContent=local.text;
  subtitleEl.innerHTML='本地规则分析 <span class="ai-source-badge local">本地</span> · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}

function toggleAISettings(){
  document.getElementById('aiSettingsPanel').classList.toggle('show');
  const key=localStorage.getItem('deepseek_api_key');
  if(key)document.getElementById('deepseekKeyInput').value=key;
}
function saveAPIKey(){
  const key=document.getElementById('deepseekKeyInput').value.trim();
  if(key){
    localStorage.setItem('deepseek_api_key',key);
    showToast('API Key 已保存，将使用 DeepSeek AI 分析');
    runAIAnalysis(true);
  }else{
    localStorage.removeItem('deepseek_api_key');
    showToast('已清除 Key，切换到本地分析');
    runAIAnalysis(true);
  }
}

// ====== Utils ======
function showToast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2800);
}

// ====== Init ======
async function init(){
  if(window.location.hostname==='localhost'||window.location.hostname.startsWith('192.168.')||window.location.hostname.startsWith('10.')){
    SYNC_SERVER='http://'+window.location.hostname+':'+window.location.port;
  }
  resetWeeksToOriginal();
  await loadState();
  applyWeekOverrides();
  rebuildIndex();
  let cleaned=false;
  for(const date of Object.keys(state.items)){
    const di=dateIndex[date];
    if(!di||di.rest){
      delete state.items[date];
      cleaned=true;
    }
  }
  if(cleaned)state.lastModified=Date.now();
  if(Object.keys(state.items).length===0&&SYNC_SERVER){
    const cloudData=await loadFromServer();
    if(cloudData&&cloudData.items){
      state.items=cloudData.items;
      state.lastModified=cloudData.lastModified||Date.now();
      for(const date of Object.keys(state.items)){
        const di=dateIndex[date];
        if(!di||di.rest)delete state.items[date];
      }
    }
  }
  saveState();
  renderAll();
  setTimeout(updateRecoveryCountdown,300);
}
init();
</script>
